
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>StudyFlow</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyFlow">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #0d0f14;
    color: #f5f5f5;
    min-height: 100vh;
}

button,
input,
select {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px calc(100px + env(safe-area-inset-bottom));
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    font-size: 23px;
    font-weight: 850;
    letter-spacing: -1px;
}

.logo span {
    color: #9b8cff;
}

.date {
    color: #9299a6;
    font-size: 11px;
}

.card,
.stat {
    background: #171a21;
    border: 1px solid #292e38;
    border-radius: 18px;
    padding: 17px;
    margin-bottom: 13px;
}

.card-title {
    font-size: 13px;
    font-weight: 750;
    margin-bottom: 13px;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 13px;
}

.stat {
    margin: 0;
}

.stat-label {
    color: #9299a6;
    font-size: 11px;
    margin-bottom: 7px;
}

.stat-value {
    font-size: 22px;
    font-weight: 800;
}

.stat-value small {
    font-size: 11px;
    color: #9299a6;
}

.timer-display {
    font-size: clamp(48px, 15vw, 66px);
    font-weight: 850;
    text-align: center;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    margin: 16px 0;
}

.timer-mode {
    text-align: center;
    color: #a99cff;
    font-size: 12px;
    font-weight: 700;
}

.timer-buttons {
    display: flex;
    gap: 10px;
}

.primary-btn,
.secondary-btn {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-weight: 750;
}

.primary-btn {
    background: #9b8cff;
    color: #111;
}

.secondary-btn {
    background: #292e38;
    color: #fff;
}

select,
input {
    width: 100%;
    padding: 13px;
    border: 1px solid #343b48;
    border-radius: 10px;
    background: #10131a;
    color: white;
    outline: none;
}

.task-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.task-form input {
    flex: 1;
    min-width: 0;
}

.task-form button {
    padding: 0 17px;
    border-radius: 10px;
    background: #9b8cff;
    color: #111;
    font-weight: 750;
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.task-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px;
    background: #10131a;
    border-radius: 10px;
}

.task-item span {
    flex: 1;
    font-size: 13px;
    overflow-wrap: anywhere;
}

.task-item.done span {
    text-decoration: line-through;
    color: #747b88;
}

.task-item button {
    background: transparent;
    color: #9299a6;
    font-size: 17px;
    padding: 3px 6px;
}

.page {
    display: none;
}

.page.active {
    display: block;
}

.nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 0;
    background: rgba(17, 19, 26, .96);
    border-top: 1px solid #292e38;
    padding: 9px 8px calc(9px + env(safe-area-inset-bottom));
    z-index: 10;
    backdrop-filter: blur(15px);
}

.nav button {
    flex: 1;
    max-width: 190px;
    background: transparent;
    color: #858c99;
    font-size: 10px;
    font-weight: 700;
    padding: 6px 3px;
}

.nav button.active {
    color: #b4a8ff;
}

.nav-icon {
    display: block;
    font-size: 20px;
    margin-bottom: 3px;
}

.subject-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
    font-size: 12px;
}

.subject-bar {
    height: 7px;
    background: #2b303b;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 6px;
}

.subject-fill {
    height: 100%;
    background: #9b8cff;
    border-radius: 20px;
}

.graph {
    display: flex;
    align-items: end;
    justify-content: space-around;
    gap: 8px;
    height: 150px;
    padding-top: 15px;
}

.graph-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: end;
    height: 100%;
    gap: 7px;
}

.graph-bar-wrap {
    height: 115px;
    width: 100%;
    display: flex;
    align-items: end;
    justify-content: center;
}

.graph-bar {
    width: min(28px, 75%);
    background: #9b8cff;
    border-radius: 6px 6px 2px 2px;
    min-height: 3px;
}

.graph-label {
    color: #9299a6;
    font-size: 10px;
}

.graph-value {
    color: #9299a6;
    font-size: 9px;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-top: 12px;
}

.calendar-day {
    aspect-ratio: 1;
    border-radius: 8px;
    background: #242933;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: #858c99;
}

.calendar-day.active {
    background: #7161c9;
    color: white;
    font-weight: 800;
}

.calendar-day.today {
    outline: 2px solid #b4a8ff;
    outline-offset: 2px;
}

.empty {
    color: #777f8c;
    text-align: center;
    font-size: 12px;
    padding: 18px 0;
}

/* StudyFlow themes and shop */
body.theme-ocean {
    background: linear-gradient(160deg,#071a2d,#102d46 55%,#0d0f14);
}

body.theme-forest {
    background: linear-gradient(160deg,#10251c,#193b2b 55%,#0d0f14);
}

body.theme-sakura {
    background: linear-gradient(160deg,#321c2c,#4b293d 55%,#0d0f14);
}

body.theme-sunset {
    background: linear-gradient(160deg,#321b12,#59301e 55%,#0d0f14);
}

body.theme-ocean .card,
body.theme-ocean .stat {
    background:#102638;
    border-color:#21445c;
}

body.theme-forest .card,
body.theme-forest .stat {
    background:#172a20;
    border-color:#2c4b38;
}

body.theme-sakura .card,
body.theme-sakura .stat {
    background:#2c202b;
    border-color:#51384b;
}

body.theme-sunset .card,
body.theme-sunset .stat {
    background:#30221c;
    border-color:#594033;
}

body.timer-neon .timer-display {
    color:#65f5ff;
    text-shadow:0 0 18px #28d9ff;
}

body.timer-gold .timer-display {
    color:#f4d27c;
    text-shadow:0 0 18px #c99b36;
}

.shop-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.shop-item {
    background:#171a21;
    border:1px solid #2a303b;
    border-radius:15px;
    padding:13px;
    min-width:0;
}

.shop-preview {
    height:55px;
    border-radius:10px;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:#252b36;
}

.shop-name {
    font-size:13px;
    font-weight:750;
    margin-bottom:4px;
}

.shop-desc {
    font-size:11px;
    color:#9299a6;
    min-height:30px;
    line-height:1.45;
}

.shop-price {
    font-size:12px;
    color:#f2d27c;
    margin:9px 0;
    font-weight:700;
}

.shop-btn {
    width:100%;
    padding:9px 6px;
    border-radius:9px;
    background:#f4f4f4;
    color:#111;
    font-size:11px;
    font-weight:750;
}

.shop-btn:disabled {
    background:#343a45;
    color:#aeb4bf;
}

.credit-pill {
    background:#282b32;
    border:1px solid #45404a;
    color:#f2d27c;
    border-radius:20px;
    padding:7px 11px;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
}

@media (max-width:360px) {
    .app {
        padding-left:12px;
        padding-right:12px;
    }
}
</style>
</head>

<body>
<div class="app">

    <header class="header">
        <div class="logo">Study<span>Flow</span></div>
        <div style="display:flex;align-items:center;gap:8px">
            <div class="credit-pill" id="creditBalance">✦ 0 スタクレ</div>
            <div class="date" id="date"></div>
        </div>
    </header>

    <!-- Home page: dashboard, timer and tasks -->
    <section class="page active" id="page-home">
        <div class="stats">
            <div class="stat">
                <div class="stat-label">今日の勉強時間</div>
                <div class="stat-value" id="todayTime">0<small>分</small></div>
            </div>
            <div class="stat">
                <div class="stat-label">累計勉強時間</div>
                <div class="stat-value" id="totalTime">0<small>分</small></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">ポモドーロタイマー</div>
            <div class="timer-mode" id="timerMode">FOCUS TIME</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="timer-buttons">
                <button class="primary-btn" id="startBtn">スタート</button>
                <button class="secondary-btn" id="resetBtn">リセット</button>
            </div>
            <div style="margin-top:14px">
                <select id="subjectSelect">
                    <option value="英語">英語</option>
                    <option value="数学">数学</option>
                    <option value="国語">国語</option>
                    <option value="理科">理科</option>
                    <option value="社会">社会</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div style="font-size:11px;color:#8f96a3;margin-top:12px">
                勉強10分ごとに10スタクレ獲得
            </div>
        </div>

        <div class="card">
            <div class="card-title">今日のタスク</div>
            <div class="task-form">
                <input id="taskInput" placeholder="今日やることを入力">
                <button id="addTask">追加</button>
            </div>
            <div class="task-list" id="tasks"></div>
        </div>
    </section>

    <!-- Record page -->
    <section class="page" id="page-graph">
        <div class="card">
            <div class="card-title">学習カレンダー</div>
            <div style="font-size:11px;color:#9299a6">
                タイマーを開始した日にマークがつくで
            </div>
            <div class="calendar-grid" id="calendar"></div>
        </div>

        <div class="card">
            <div class="card-title">直近7日間の勉強時間</div>
            <div class="graph" id="graph"></div>
        </div>

        <div class="card">
            <div class="card-title">教科別の勉強時間</div>
            <div id="subjectList"></div>
        </div>
    </section>

    <!-- Shop page -->
    <section class="page" id="page-shop">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                <div>
                    <div class="card-title" style="margin-bottom:4px">StudyFlow SHOP</div>
                    <div style="font-size:18px;font-weight:800">自分好みにカスタマイズ</div>
                </div>
                <div class="credit-pill" id="shopBalance">✦ 0</div>
            </div>
            <p style="font-size:11px;color:#9299a6;margin-top:9px">
                勉強して貯めたスタクレでアイテムを購入。購入後はいつでも切り替えられるで。
            </p>
        </div>

        <div class="card">
            <div class="card-title" style="margin-bottom:10px">テーマ・背景</div>
            <div class="shop-grid" id="themeShop"></div>

            <div class="card-title" style="margin:18px 2px 10px">
                タイマー・アクセント
            </div>
            <div class="shop-grid" id="effectShop"></div>
        </div>
    </section>

</div>

<nav class="nav">
    <button class="active" data-page="home" aria-current="page">
        <span class="nav-icon">⌂</span>ホーム
    </button>
    <button data-page="graph">
        <span class="nav-icon">▦</span>記録
    </button>
    <button data-page="shop">
        <span class="nav-icon">✦</span>ショップ
    </button>
</nav>

<script>
"use strict";

/* --------------------------------
   DATA
-------------------------------- */

const STORAGE_KEY = "studyFlow";

const todayKey = () => {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
};

const defaultData = {
    daily: {},
    subjects: {},
    tasks: [],
    credits: 0,
    creditRemainderSeconds: 0,
    activeDays: [],
    ownedItems: ["theme-night"],
    equippedTheme: "theme-night",
    equippedEffect: "effect-normal"
};

let data;

try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    data = saved && typeof saved === "object"
        ? { ...defaultData, ...saved }
        : { ...defaultData };
} catch (error) {
    data = { ...defaultData };
}

data.daily = data.daily || {};
data.subjects = data.subjects || {};
data.tasks = Array.isArray(data.tasks) ? data.tasks : [];
data.credits = data.credits || 0;
data.creditRemainderSeconds = data.creditRemainderSeconds || 0;
data.activeDays = Array.isArray(data.activeDays) ? data.activeDays : [];
data.ownedItems = Array.isArray(data.ownedItems)
    ? data.ownedItems
    : ["theme-night"];
data.equippedTheme = data.equippedTheme || "theme-night";
data.equippedEffect = data.equippedEffect || "effect-normal";

function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* --------------------------------
   DATE / DISPLAY
-------------------------------- */

document.getElementById("date").textContent =
    new Date().toLocaleDateString("ja-JP", {
        month: "numeric",
        day: "numeric",
        weekday: "short"
    });

function formatTime(seconds) {
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const remain = minutes % 60;

    if (hours > 0) {
        return `${hours}時間${remain}分`;
    }
    return `${remain}分`;
}

function getTodaySeconds() {
    return data.daily[todayKey()] || 0;
}

function getTotalSeconds() {
    return Object.values(data.daily)
        .reduce((sum, value) => sum + (Number(value) || 0), 0);
}

/* --------------------------------
   TIMER
-------------------------------- */

const FOCUS_SECONDS = 25 * 60;
const BREAK_SECONDS = 5 * 60;

let timerSeconds = FOCUS_SECONDS;
let timerRunning = false;
let timerInterval = null;
let isBreak = false;
let lastTick = null;

const timerElement = document.getElementById("timer");
const startButton = document.getElementById("startBtn");
const resetButton = document.getElementById("resetBtn");

function renderTimer() {
    const minutes = Math.floor(timerSeconds / 60);
    const seconds = timerSeconds % 60;

    timerElement.textContent =
        `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

    document.getElementById("timerMode").textContent =
        isBreak ? "BREAK TIME" : "FOCUS TIME";

    startButton.textContent = timerRunning ? "一時停止" : "スタート";
}

function markActiveDay() {
    const key = todayKey();

    if (!data.activeDays.includes(key)) {
        data.activeDays.push(key);
    }

    save();
    renderCalendar();
}

function earnCredits(seconds) {
    if (isBreak || seconds <= 0) return;

    data.creditRemainderSeconds += seconds;

    if (data.creditRemainderSeconds >= 600) {
        const earned = Math.floor(data.creditRemainderSeconds / 600) * 10;
        data.credits += earned;
        data.creditRemainderSeconds %= 600;
    }
}

function addStudySeconds(seconds) {
    if (seconds <= 0 || isBreak) return;

    const key = todayKey();
    const subject = document.getElementById("subjectSelect").value;

    data.daily[key] = (data.daily[key] || 0) + seconds;
    data.subjects[subject] = (data.subjects[subject] || 0) + seconds;

    earnCredits(seconds);
    save();
    renderDashboard();
}

function tick() {
    const now = Date.now();
    const elapsed = Math.max(0, Math.floor((now - lastTick) / 1000));
    lastTick = now;

    if (elapsed <= 0) return;

    if (!isBreak) {
        addStudySeconds(elapsed);
    }

    timerSeconds = Math.max(0, timerSeconds - elapsed);

    if (timerSeconds <= 0) {
        timerRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;

        if (isBreak) {
            isBreak = false;
            timerSeconds = FOCUS_SECONDS;
        } else {
            isBreak = true;
            timerSeconds = BREAK_SECONDS;
        }

        alert(isBreak ? "お疲れさま！5分休憩しよう。" : "休憩終了！次の勉強を始めよう。");
    }

    renderTimer();
    renderDashboard();
}

function startTimer() {
    if (timerRunning) {
        timerRunning = false;
        clearInterval(timerInterval);
        timerInterval = null;
        lastTick = null;
        renderTimer();
        return;
    }

    timerRunning = true;

    if (!isBreak) {
        markActiveDay();
    }

    lastTick = Date.now();
    timerInterval = setInterval(tick, 1000);

    renderTimer();
}

function resetTimer() {
    timerRunning = false;
    clearInterval(timerInterval);
    timerInterval = null;
    lastTick = null;
    isBreak = false;
    timerSeconds = FOCUS_SECONDS;

    renderTimer();
}

startButton.addEventListener("click", startTimer);
resetButton.addEventListener("click", resetTimer);

/* --------------------------------
   TASKS
-------------------------------- */

function renderTasks() {
    const container = document.getElementById("tasks");
    container.innerHTML = "";

    if (data.tasks.length === 0) {
        container.innerHTML =
            '<div class="empty">タスクはまだありません</div>';
        return;
    }

    data.tasks.forEach(task => {
        const item = document.createElement("div");
        item.className = "task-item" + (task.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = !!task.done;
        checkbox.style.width = "18px";
        checkbox.style.height = "18px";

        checkbox.addEventListener("change", () => {
            task.done = checkbox.checked;
            save();
            renderTasks();
        });

        const label = document.createElement("span");
        label.textContent = task.text;

        const remove = document.createElement("button");
        remove.textContent = "×";
        remove.setAttribute("aria-label", "削除");

        remove.addEventListener("click", () => {
            data.tasks = data.tasks.filter(x => x.id !== task.id);
            save();
            renderTasks();
        });

        item.append(checkbox, label, remove);
        container.appendChild(item);
    });
}

document.getElementById("addTask").addEventListener("click", () => {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    if (!text) return;

    data.tasks.push({
        id: Date.now() + Math.random(),
        text,
        done: false
    });

    input.value = "";
    save();
    renderTasks();
});

document.getElementById("taskInput").addEventListener("keydown", event => {
    if (event.key === "Enter") {
        document.getElementById("addTask").click();
    }
});

/* --------------------------------
   DASHBOARD
-------------------------------- */

function renderDashboard() {
    document.getElementById("todayTime").innerHTML =
        `${Math.floor(getTodaySeconds() / 60)}<small>分</small>`;

    document.getElementById("totalTime").innerHTML =
        `${Math.floor(getTotalSeconds() / 60)}<small>分</small>`;

    document.getElementById("creditBalance").textContent =
        `✦ ${data.credits} スタクレ`;

    const shopBalance = document.getElementById("shopBalance");

    if (shopBalance) {
        shopBalance.textContent = `✦ ${data.credits}`;
    }
}

/* --------------------------------
   RECORD: CALENDAR
-------------------------------- */

function renderCalendar() {
    const calendar = document.getElementById("calendar");
    if (!calendar) return;

    calendar.innerHTML = "";

    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

    weekdays.forEach(day => {
        const label = document.createElement("div");
        label.textContent = day;
        label.style.textAlign = "center";
        label.style.color = "#9299a6";
        label.style.fontSize = "10px";
        calendar.appendChild(label);
    });

    for (let i = 0; i < firstDay; i++) {
        const blank = document.createElement("div");
        calendar.appendChild(blank);
    }

    for (let day = 1; day <= daysInMonth; day++) {
        const key =
            `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

        const cell = document.createElement("div");
        cell.className = "calendar-day";

        if (data.activeDays.includes(key)) {
            cell.classList.add("active");
        }

        if (key === todayKey()) {
            cell.classList.add("today");
        }

        cell.textContent = day;
        calendar.appendChild(cell);
    }
}

/* --------------------------------
   RECORD: GRAPH
-------------------------------- */

function renderGraph() {
    const graph = document.getElementById("graph");
    graph.innerHTML = "";

    const days = [];

    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);

        const key =
            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

        days.push({
            key,
            label: `${d.getMonth() + 1}/${d.getDate()}`,
            seconds: data.daily[key] || 0
        });
    }

    const max = Math.max(...days.map(day => day.seconds), 60);

    days.forEach(day => {
        const column = document.createElement("div");
        column.className = "graph-column";

        const value = document.createElement("div");
        value.className = "graph-value";
        value.textContent = Math.floor(day.seconds / 60) + "分";

        const wrap = document.createElement("div");
        wrap.className = "graph-bar-wrap";

        const bar = document.createElement("div");
        bar.className = "graph-bar";
        bar.style.height =
            `${Math.max(3, (day.seconds / max) * 100)}%`;

        const label = document.createElement("div");
        label.className = "graph-label";
        label.textContent = day.label;

        wrap.appendChild(bar);
        column.append(value, wrap, label);
        graph.appendChild(column);
    });
}

/* --------------------------------
   RECORD: SUBJECTS
-------------------------------- */

function renderSubjects() {
    const container = document.getElementById("subjectList");
    container.innerHTML = "";

    const entries = Object.entries(data.subjects)
        .filter(([, seconds]) => seconds > 0)
        .sort((a, b) => b[1] - a[1]);

    if (entries.length === 0) {
        container.innerHTML =
            '<div class="empty">まだ記録がありません</div>';
        return;
    }

    const max = Math.max(...entries.map(entry => entry[1]));

    entries.forEach(([subject, seconds]) => {
        const row = document.createElement("div");
        row.className = "subject-row";

        const left = document.createElement("div");
        left.style.flex = "1";

        const top = document.createElement("div");
        top.style.display = "flex";
        top.style.justifyContent = "space-between";

        const name = document.createElement("span");
        name.textContent = subject;

        const time = document.createElement("span");
        time.textContent = formatTime(seconds);

        const bar = document.createElement("div");
        bar.className = "subject-bar";

        const fill = document.createElement("div");
        fill.className = "subject-fill";
        fill.style.width = `${(seconds / max) * 100}%`;

        bar.appendChild(fill);
        top.append(name, time);
        left.append(top, bar);
        row.appendChild(left);
        container.appendChild(row);
    });
}

function applyShopAppearance() {
    document.body.classList.remove(
        "theme-ocean",
        "theme-forest",
        "theme-sakura",
        "theme-sunset",
        "timer-neon",
        "timer-gold"
    );

    const theme = shopItems.find(x => x.id === data.equippedTheme);
    const effect = shopItems.find(x => x.id === data.equippedEffect);

    if (theme && theme.class) {
        document.body.classList.add(theme.class);
    }

    if (effect && effect.class) {
        document.body.classList.add(effect.class);
    }
}

function renderShop() {
    const groups = {
        theme:document.getElementById("themeShop"),
        effect:document.getElementById("effectShop")
    };

    groups.theme.innerHTML = "";
    groups.effect.innerHTML = "";

    shopItems.forEach(item => {
        const owned = data.ownedItems.includes(item.id);

        const equipped = item.type === "theme"
            ? data.equippedTheme === item.id
            : data.equippedEffect === item.id;

        const card = document.createElement("div");
        card.className = "shop-item";

        card.innerHTML = `
            <div class="shop-preview">${item.preview}</div>
            <div class="shop-name">${item.name}</div>
            <div class="shop-desc">${item.desc}</div>
            <div class="shop-price">
                ${item.price === 0 ? "無料" : `✦ ${item.price} スタクレ`}
            </div>
            <button class="shop-btn" ${
                !owned && data.credits < item.price ? "disabled" : ""
            }>
                ${equipped ? "使用中" : owned ? "装備する" : "購入する"}
            </button>
        `;

        const button = card.querySelector("button");

        button.addEventListener("click", () => {
            if (!owned) {
                if (data.credits < item.price) return;

                data.credits -= item.price;
                data.ownedItems.push(item.id);
            }

            if (item.type === "theme") {
                data.equippedTheme = item.id;
            } else {
                data.equippedEffect = item.id;
            }

            save();
            applyShopAppearance();
            renderShop();
            renderDashboard();
        });

        groups[item.type].appendChild(card);
    });
}

/* --------------------------------
   NAVIGATION
-------------------------------- */

document.querySelectorAll(".nav button[data-page]").forEach(button => {
    button.addEventListener("click", () => {
        const page = button.dataset.page;

        document.querySelectorAll(".page").forEach(section => {
            section.classList.remove("active");
        });

        const target = document.getElementById(`page-${page}`);

        if (target) {
            target.classList.add("active");
        }

        document.querySelectorAll(".nav button").forEach(navButton => {
            navButton.classList.remove("active");
            navButton.removeAttribute("aria-current");
        });

        button.classList.add("active");
        button.setAttribute("aria-current", "page");

        if (page === "graph") {
            renderCalendar();
            renderGraph();
            renderSubjects();
        }

        if (page === "shop") {
            renderShop();
        }

        window.scrollTo(0, 0);
    });
});
