<html lang="ja">

<meta name="theme-color" content="#0d0f14">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StudyFlow">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: #0d0f14;
    color: #f5f5f5;
    min-height: 100vh;
}

button,
input,
select {
    font: inherit;
}

button {
    border: none;
    cursor: pointer;
}

.app {
    width: 100%;
    max-width: 500px;
    margin: auto;
    min-height: 100vh;
    padding: 18px 15px 90px;
}

/* Header */
.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.date {
    color: #888;
    font-size: 12px;
}

/* Cards */
.card {
    background: #171a21;
    border: 1px solid #252a34;
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
}

.card-title {
    font-size: 13px;
    color: #9ba1ad;
    margin-bottom: 10px;
}

/* Dashboard */
.dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.stat {
    background: #171a21;
    border: 1px solid #252a34;
    border-radius: 16px;
    padding: 16px;
}

.stat-number {
    font-size: 27px;
    font-weight: 800;
}

.stat-label {
    font-size: 11px;
    color: #888;
    margin-top: 4px;
}

/* Timer */
.timer-card {
    text-align: center;
    padding: 25px 18px;
}

.mode {
    color: #a5abb6;
    font-size: 13px;
    margin-bottom: 8px;
}

.timer {
    font-size: 62px;
    font-weight: 800;
    letter-spacing: 2px;
    margin: 4px 0 16px;
}

.timer-buttons {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.primary {
    background: #ffffff;
    color: #111;
    padding: 11px 25px;
    border-radius: 12px;
    font-weight: 700;
}

.secondary {
    background: #292e38;
    color: white;
    padding: 11px 20px;
    border-radius: 12px;
}

/* Subject */
.subject-select {
    width: 100%;
    background: #222630;
    border: 1px solid #303642;
    color: white;
    padding: 12px;

    outline: none;
}

.subject-list {
    margin-top: 14px;
}

.subject-row {
    margin-bottom: 13px;
}

.subject-info {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

.bar {
    height: 7px;
    background: #292e37;
    border-radius: 20px;
    overflow: hidden;
}

.bar-fill {
    height: 100%;
    background: #ffffff;
    border-radius: 20px;
}

/* Tasks */
.task-input {
    display: flex;
    gap: 7px;
}

.task-input input {
    flex: 1;
    min-width: 0;

    outline: none;
}

    width: 45px;
    border-radius: 10px;

}

.task {
    display: flex;

    border-bottom: 1px solid #242832;

.task input {
    width: 18px;
    height: 18px;
    accent-color: white;
}

.delete-task {

}

/* Graph */
.graph {
    height: 150px;
    display: flex;
    align-items: end;
    gap: 7px;
    padding-top: 15px;
}

.graph-day {

}

.graph-bar {
    width: 100%;
    max-width: 28px;
    background: white;
    border-radius: 5px 5px 2px 2px;
    min-height: 3px;
}

.graph-label {
    font-size: 9px;
    color: #777;
}

/* Navigation */
.nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(500px, 100%);
    height: 65px;
    background: rgba(18,20,26,.96);
    backdrop-filter: blur(10px);
    border-top: 1px solid #252a34;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.nav button {
    background: none;
    color: #777;
    font-size: 11px;
}

.nav button.active {
    color: white;
}

.nav-icon {
    display: block;
    font-size: 20px;
    margin-bottom: 2px;
}

/* Mobile */
@media (max-width: 380px) {
    .timer {
        font-size: 52px;
    }

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">StudyFlow</div>
        <div class="date" id="date"></div>
    </header>

    <!-- Dashboard -->
    <div class="dashboard">

        <div class="stat">
            <div class="stat-number" id="todayTime">0分</div>
            <div class="stat-label">今日の勉強時間</div>
        </div>

        <div class="stat">
            <div class="stat-number" id="totalTime">0時間</div>
            <div class="stat-label">累計勉強時間</div>
        </div>

    </div>

    <!-- Timer -->
    <section class="card timer-card">

        <div class="mode" id="timerMode">
            勉強時間
        </div>

        <div class="timer" id="timer">
            25:00
        </div>

        <div class="timer-buttons">

            <button class="primary" id="startBtn">
                スタート
            </button>

            <button class="secondary" id="resetBtn">
                リセット
            </button>

        </div>

    </section>

    <!-- Subject -->
    <section class="card">

        <div class="card-title">
            今勉強している教科
        </div>

        <select class="subject-select" id="subjectSelect">

            <option value="英語">英語</option>
            <option value="数学">数学</option>
            <option value="国語">国語</option>
            <option value="理科">理科</option>
            <option value="社会">社会</option>
            <option value="その他">その他</option>

        </select>

        <div class="subject-list" id="subjectList"></div>

    </section>

    <!-- Tasks -->
    <section class="card">

        <div class="card-title">
            今日のタスク
        </div>

        <div class="task-input">

            <input
                id="taskInput"
                type="text"
                placeholder="例：数学ワーク20ページ"
            >

            <button
                class="add-btn"
                id="addTask"
            >
                +
            </button>

        </div>

        <div class="tasks" id="tasks"></div>

    </section>

    <!-- Graph -->
    <section class="card">

        <div class="card-title">
            過去7日間の勉強時間
        </div>

        <div class="graph" id="graph"></div>

    </section>

</div>


<!-- Bottom Navigation -->
<nav class="nav">

    <button class="active">
        <span class="nav-icon">⌂</span>
        ホーム
    </button>

    <button>
        <span class="nav-icon">◷</span>
        タイマー
    </button>

    <button>
        <span class="nav-icon">✓</span>
        タスク
    </button>

    <button>
        <span class="nav-icon">▥</span>
        記録
    </button>

</nav>


<script>

/* =========================
   DATA
========================= */

const subjects = [
    "英語",
    "数学",
    "国語",
    "理科",
    "社会",
    "その他"
];

let data = JSON.parse(
    localStorage.getItem("studyFlow")
) || {

    totalSeconds: 0,

    subjectSeconds: {
        英語: 0,
        数学: 0,
        国語: 0,
        理科: 0,
        社会: 0,
        その他: 0
    },

    daily: {},

    tasks: []

};


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(
        "studyFlow",
        JSON.stringify(data)
    );

}


/* =========================
   DATE
========================= */

function getDateKey(date = new Date()) {

    return date.toISOString().slice(0,10);

}

function formatDate(date = new Date()) {

    return `${date.getMonth()+1}/${date.getDate()}`;

}

document.getElementById("date").textContent =
    `${new Date().getMonth()+1}月${new Date().getDate()}日`;


/* =========================
   TIMER
========================= */

let timerSeconds = 25 * 60;

let timerRunning = false;

let timerInterval = null;

let workMode = true;


function updateTimer() {

    const min =
        Math.floor(timerSeconds / 60)
        .toString()
        .padStart(2,"0");

    const sec =
        (timerSeconds % 60)
        .toString()
        .padStart(2,"0");

    document.getElementById("timer").textContent =
        `${min}:${sec}`;

}


function startTimer() {

    if (timerRunning) {

        clearInterval(timerInterval);

        timerRunning = false;

        document.getElementById("startBtn").textContent =
            "スタート";

        return;

    }

    timerRunning = true;

    document.getElementById("startBtn").textContent =
        "一時停止";

    timerInterval = setInterval(() => {

        timerSeconds--;

        updateTimer();

        if (workMode) {

            addStudySecond();

        }

        if (timerSeconds <= 0) {

            clearInterval(timerInterval);

            timerRunning = false;

            document.getElementById("startBtn").textContent =
                "スタート";

            if (workMode) {

                workMode = false;

                timerSeconds = 5 * 60;

                document.getElementById("timerMode").textContent =
                    "休憩時間";

            } else {

                workMode = true;

                timerSeconds = 25 * 60;

                document.getElementById("timerMode").textContent =
                    "勉強時間";

            }

            updateTimer();

        }

    },1000);

}


function resetTimer() {

    clearInterval(timerInterval);

    timerRunning = false;

    workMode = true;

    timerSeconds = 25 * 60;

    document.getElementById("startBtn").textContent =
        "スタート";

    document.getElementById("timerMode").textContent =
        "勉強時間";

    updateTimer();

}


function addStudySecond() {

    const subject =
        document.getElementById("subjectSelect").value;

    const today =
        getDateKey();

    data.totalSeconds++;

    data.subjectSeconds[subject]++;

    if (!data.daily[today]) {

        data.daily[today] = 0;

    }

    data.daily[today]++;

    save();

    render();

}


/* =========================
   MANUAL SUBJECT TIME
========================= */

document
    .getElementById("subjectSelect")
    .addEventListener("change", render);


/* =========================
   TASKS
========================= */

function addTask() {

    const input =
        document.getElementById("taskInput");

    const text =
        input.value.trim();

    if (!text) return;

    data.tasks.push({

        id: Date.now(),

        text: text,

        done: false,

        date: getDateKey()

    });

    input.value = "";

    save();

    renderTasks();

}


function toggleTask(id) {

    const task =
        data.tasks.find(t => t.id === id);

    if (!task) return;

    task.done = !task.done;

    save();

    renderTasks();

}


function deleteTask(id) {

    data.tasks =
        data.tasks.filter(t => t.id !== id);

    save();

    renderTasks();

}


function renderTasks() {

    const container =
        document.getElementById("tasks");

    container.innerHTML = "";

    const today =
        getDateKey();

    const todayTasks =
        data.tasks.filter(t => t.date === today);

    if (todayTasks.length === 0) {

        container.innerHTML =
            `<div style="color:#666;font-size:12px;padding:10px 0">
                タスクはまだありません
             </div>`;

        return;

    }

    todayTasks.forEach(task => {

        const div =
            document.createElement("div");

        div.className =
            `task ${task.done ? "done" : ""}`;

        div.innerHTML = `

            <input
                type="checkbox"
                ${task.done ? "checked" : ""}
                onchange="toggleTask(${task.id})"
            >

            <span>${escapeHtml(task.text)}</span>

            <button
                class="delete-task"
                onclick="deleteTask(${task.id})"
            >
                ×
            </button>

        `;

        container.appendChild(div);

    });

}


function escapeHtml(text) {

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   SUBJECT DISPLAY
========================= */

function formatMinutes(seconds) {

    return Math.floor(seconds / 60);

}


function renderSubjects() {

    const container =
        document.getElementById("subjectList");

    container.innerHTML = "";

    const max =
        Math.max(
            ...Object.values(data.subjectSeconds),
            1
        );

    subjects.forEach(subject => {

        const seconds =
            data.subjectSeconds[subject] || 0;

        const percent =
            (seconds / max) * 100;

        const div =
            document.createElement("div");

        div.className =
            "subject-row";

        div.innerHTML = `

            <div class="subject-info">

                <span>${subject}</span>

                <span>
                    ${formatMinutes(seconds)}分
                </span>

            </div>

            <div class="bar">

                <div
                    class="bar-fill"
                    style="width:${percent}%"
                ></div>

            </div>

        `;

        container.appendChild(div);

    });

}


/* =========================
   GRAPH
========================= */

function renderGraph() {

    const container =
        document.getElementById("graph");

    container.innerHTML = "";

    const today =
        new Date();

    const values = [];

    for (let i = 6; i >= 0; i--) {

        const date =
            new Date(today);

        date.setDate(
            today.getDate() - i
        );

        const key =
            getDateKey(date);

        values.push({

            key: key,

            value: data.daily[key] || 0,

            label:
                `${date.getMonth()+1}/${date.getDate()}`

        });

    }

    const max =
        Math.max(
            ...values.map(v => v.value),
            60
        );

    values.forEach(day => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "graph-day";

        const height =
            Math.max(
                3,
                (day.value / max) * 100
            );

        wrapper.innerHTML = `

            <div
                class="graph-bar"
                style="height:${height}%"
                title="${formatMinutes(day.value)}分"
            ></div>

            <div class="graph-label">
                ${day.label}
            </div>

        `;

        container.appendChild(wrapper);

    });

}


/* =========================
   DASHBOARD
========================= */

function renderDashboard() {

    const today =
        data.daily[getDateKey()] || 0;

    document.getElementById("todayTime")
        .textContent =
        `${formatMinutes(today)}分`;

    const totalMinutes =
        Math.floor(data.totalSeconds / 60);

    const hours =
        Math.floor(totalMinutes / 60);

    const minutes =
        totalMinutes % 60;

    document.getElementById("totalTime")
        .textContent =
        hours > 0
            ? `${hours}時間${minutes}分`
            : `${minutes}分`;

}


/* =========================
   RENDER
========================= */

function render() {

    renderDashboard();

    renderSubjects();

    renderTasks();

    renderGraph();

}


/* =========================
   EVENTS
========================= */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startTimer
    );

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        resetTimer
    );

document
    .getElementById("addTask")
    .addEventListener(
        "click",
        addTask
    );

document
    .getElementById("taskInput")
    .addEventListener(
        "keydown",
        e => {

            if (e.key === "Enter") {

                addTask();

            }

        }
    );


/* =========================
   INITIALIZE
========================= */

updateTimer();

render();

</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
```
